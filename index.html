
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jack's Bin Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #eef1f5;
      color: #172332;
      font-family: Arial, sans-serif;
    }

    main { max-width: 560px; margin: auto; }

    h1 { margin: 4px 0 22px; font-size: 34px; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      color: #64748b;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px #1723320a;
    }

    .selector-label {
      display: block;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      color: #172332;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid #3476d0;
      outline-offset: 2px;
    }

    .date {
      font-size: 27px;
      font-weight: bold;
      margin: 12px 0;
    }

    .muted { color: #64748b; font-size: 14px; }

    .bins {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .bin {
      padding: 18px 8px;
      border-radius: 12px;
      color: white;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
    }

    .bin span {
      display: block;
      font-size: 27px;
      margin-bottom: 9px;
    }

    .upcoming {
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 0;
    }

    .upcoming:last-child { border: none; }

    .upcoming strong {
      display: block;
      margin-bottom: 6px;
    }

    #status { text-align: center; padding: 12px; }
    .error { color: #b42318; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">BIN COLLECTION DASHBOARD</div>
  <h1>♻ Bin Day</h1>

  <section class="card">
    <label class="eyebrow selector-label" for="property">
      SELECT PROPERTY
    </label>
    <select id="property">
      <option value="jack">Jack — Brentwood</option>
      <option value="mark">Mark — Witham</option>
      <option value="clare">Clare — Runwell</option>
    </select>
  </section>

  <section class="card">
    <div class="eyebrow">NEXT COLLECTION</div>
    <div class="date" id="nextDate">Loading...</div>
    <div class="muted" id="countdown"></div>
    <div class="bins" id="nextBins"></div>
  </section>

  <section class="card">
    <div class="eyebrow">UPCOMING COLLECTIONS</div>
    <div id="upcoming"></div>
  </section>

  <div class="muted" id="status">Loading collection data...</div>
</main>

<script>
const binStyles = [
  ["Food Waste", "🍎", "#53954b", "Food"],
  ["Garden Waste", "🌿", "#347a40", "Garden"],
  ["Glass", "🍾", "#168b8c", "Glass"],
  ["Blue Sack", "📦", "#3476d0", "Blue Sack"],
  ["White Sack", "♻", "#bd8c28", "White Sack"],
  ["Refuse", "🗑", "#414b58", "Refuse"]
];

const propertySelect = document.getElementById("property");

try {
  const saved = localStorage.getItem("selectedProperty");
  if (["jack", "mark", "clare"].includes(saved)) {
    propertySelect.value = saved;
  }
} catch (error) {
  // The dashboard still works if storage is unavailable.
}

function getStyle(type) {
  return binStyles.find(b => type.includes(b[0])) ||
         ["", "🗑", "#64748b", type];
}

function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(s) {
  return parseDate(s).toLocaleDateString("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long"
  });
}

function renderBin(type) {
  const b = getStyle(type);
  const div = document.createElement("div");
  div.className = "bin";
  div.style.background = b[2];

  const icon = document.createElement("span");
  icon.textContent = b[1];

  div.append(icon, document.createTextNode(b[3]));
  return div;
}

let loadNumber = 0;

async function loadBins() {
  const currentLoad = ++loadNumber;
  const property = propertySelect.value;
  const status = document.getElementById("status");
  const nextDate = document.getElementById("nextDate");
  const countdown = document.getElementById("countdown");
  const nextBins = document.getElementById("nextBins");
  const upcoming = document.getElementById("upcoming");

  status.classList.remove("error");
  status.textContent = "Loading collection data...";
  nextDate.textContent = "Loading...";
  countdown.textContent = "";
  nextBins.replaceChildren();
  upcoming.replaceChildren();

  try {
    const response = await fetch(
      "./data/" + property + ".json?cache=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Cannot load collection data");
    }

    const data = await response.json();

    // Ignore older requests if the property changed.
    if (currentLoad !== loadNumber) return;

    if (!Array.isArray(data.collections)) {
      throw new Error("Invalid collection data");
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const grouped = {};

    for (const item of data.collections) {
      if (parseDate(item.date) < today) continue;
      (grouped[item.date] ??= []).push(item.type);
    }

    const dates = Object.keys(grouped).sort();

    if (!dates.length) {
      throw new Error("No future collection dates available");
    }

    const next = dates[0];

    const days = Math.round(
      (Date.UTC(
        parseDate(next).getFullYear(),
        parseDate(next).getMonth(),
        parseDate(next).getDate()
      ) - Date.UTC(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
      )) / 86400000
    );

    nextDate.textContent = formatDate(next);

    countdown.textContent =
      days === 0 ? "Collection is today!" :
      days === 1 ? "Collection is tomorrow!" :
      days + " days to go";

    nextBins.replaceChildren(
      ...grouped[next].map(renderBin)
    );

    for (const date of dates.slice(1, 5)) {
      const row = document.createElement("div");
      row.className = "upcoming";

      const heading = document.createElement("strong");
      heading.textContent = formatDate(date);

      const types = document.createElement("div");
      types.className = "muted";
      types.textContent = grouped[date].join(" · ");

      row.append(heading, types);
      upcoming.append(row);
    }

    const updated = new Date(data.updated);

    status.textContent = Number.isNaN(updated.getTime())
      ? "Collection data loaded"
      : "Schedule updated: " +
        updated.toLocaleString("en-GB");

  } catch (error) {
    if (currentLoad !== loadNumber) return;

    nextDate.textContent = "Schedule unavailable";
    countdown.textContent = "";
    nextBins.replaceChildren();
    upcoming.replaceChildren();
    status.textContent = error.message;
    status.classList.add("error");
  }
}

propertySelect.addEventListener("change", () => {
  try {
    localStorage.setItem(
      "selectedProperty",
      propertySelect.value
    );
  } catch (error) {
    // Saving the selection is optional.
  }

  loadBins();
});

loadBins();
</script>
</body>
</html>
