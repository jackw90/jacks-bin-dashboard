name: Test Scheduled Actions

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "Scheduled workflow triggered!"
          echo "Event: ${{ github.event_name }}"
          date -u
