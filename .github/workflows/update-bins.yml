
name: Update Bin Collections

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: bin-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest bin collections
        env:
          JACK_UPRN: ${{ secrets.JACK_UPRN }}
          MARK_UPRN: ${{ secrets.MARK_UPRN }}
          MARK_POSTCODE: ${{ secrets.MARK_POSTCODE }}
          CLARE_UPRN: ${{ secrets.CLARE_UPRN }}
        run: python scripts/fetch_bins.py

      - name: Prepare website
        run: |
          mkdir -p _site/data
          cp index.html bins.json _site/
          cp data/*.json _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
